[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verdix-ai"
version = "30.0.0"
description = "VERDIX AI Terminal - Creado por NOX"
authors = [{name = "NOX"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "ddgs>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0"
]

[tool.setuptools]
packages = ["verdix_ai", "verdix_ai.core"]

[project.scripts]
verdixcode = "verdix_ai.main:main"
