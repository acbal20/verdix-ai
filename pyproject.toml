[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verdix-ai"
version = "30.0.0"
description = "VERDIX AI Terminal - Creado por NOX"
authors = [{name = "NOX"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "groq>=1.7.0",
    "rich>=15.0.0",
    "requests>=2.34.0",
    "Pillow>=13.0.0",
    "ddgs>=1.0.0"
]

[tool.setuptools]
packages = ["verdix_ai", "verdix_ai.core"]

[project.scripts]
verdixcode = "verdix_ai.main:main"
